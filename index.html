<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home | Putra Azren</title>
  <link rel="stylesheet" href="style.css">

  <style>
  /* ==========================
     HOMEPAGE ANIMATIONS ONLY
  ========================== */

  body {
    margin: 0;
    background: #06101f;
    color: white;
    font-family: Arial, sans-serif;
  }

  /* Fade-in + Slide-up */
  .fade-up {
    opacity: 0;
    transform: translateY(30px);
    animation: fadeUp 1s ease forwards;
  }

  @keyframes fadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Floating avatar */
  .float-avatar {
    animation: floatAnim 3.5s ease-in-out infinite;
  }

  @keyframes floatAnim {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }

  /* Button glow */
  .btn-animate {
    animation: glowPulse 2.5s infinite;
  }

  @keyframes glowPulse {
    0% { box-shadow: 0 0 8px rgba(42,208,255,0.4); }
    50% { box-shadow: 0 0 18px rgba(42,208,255,0.9); }
    100% { box-shadow: 0 0 8px rgba(42,208,255,0.4); }
  }

  /* ==========================
     TYPEWRITER EFFECT
  ========================== */

  .typewriter {
    display: inline-block;
    overflow: hidden;
    white-space: nowrap;
    border-right: 3px solid #2ad0ff;
    width: 0;
    animation:
      typing 2.8s steps(24, end) forwards,
      blink 0.7s step-end infinite;
  }

  @keyframes typing {
    from { width: 0; }
    to { width: 100%; }
  }

  @keyframes blink {
    50% { border-color: transparent; }
  }

  /* ==========================
     LAYOUT
  ========================== */

  header {
    background: #0a162b;
    padding: 20px 0;
  }

  .header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1200px;
    margin: auto;
    padding: 0 20px;
  }

  .nav-list {
    list-style: none;
    display: flex;
    gap: 20px;
  }

  .nav-list a {
    color: white;
    text-decoration: none;
  }

  .nav-list a.active {
    color: #2ad0ff;
  }

  .home-flex {
    max-width: 1200px;
    margin: auto;
    padding: 120px 20px 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
    flex-wrap: wrap;
  }

  .home-text {
    max-width: 600px;
  }

  .home-text h2 {
    font-size: 3rem;
    color: #2ad0ff;
  }

  .home-text h3 {
    margin-top: 20px;
    line-height: 1.5;
  }

  .avatar {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 3px solid #2ad0ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    color: #2ad0ff;
  }

  /* ==========================
     QUICK NAV
  ========================== */

  .quick-nav {
    width: 100%;
    margin-top: 60px;
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .quick-nav .btn {
    padding: 12px 24px;
    border-radius: 8px;
    background: linear-gradient(135deg, #2ad0ff, #478bff);
    color: #06101f;
    font-weight: 600;
    text-decoration: none;
  }

  /* ==========================
     SPOTIFY
  ========================== */

  .spotify-player {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #0a162b;
  }
  </style>
</head>

<body>

<header>
  <div class="header-content">
    <h1>PUTRA AZREN</h1>
    <nav class="fade-up" style="animation-delay:0.3s;">
      <ul class="nav-list">
        <li><a class="active" href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="education.html">Education</a></li>
        <li><a href="experience.html">Experience</a></li>
        <li><a href="achievements.html">Achievements</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="home-particles">
  <div class="home-flex">

    <div class="home-text fade-up" style="animation-delay:0.6s;">
      <h2><span class="typewriter">Hello, I'm Putra Azren</span></h2>

      <h3 class="fade-up" style="animation-delay:3s;">
        Web Developer & Digital Archivist<br>
        Creating modern, structured, and meaningful web content.
      </h3>
    </div>

    <div class="fade-up" style="animation-delay:1.5s;">
      <div class="avatar float-avatar">PA</div>
    </div>

    <div class="quick-nav fade-up" style="animation-delay:4.5s;">
      <a href="about.html" class="btn btn-animate">About</a>
      <a href="education.html" class="btn btn-animate">Education</a>
      <a href="experience.html" class="btn btn-animate">Experience</a>
      <a href="achievements.html" class="btn btn-animate">Achievements</a>
      <a href="gallery.html" class="btn btn-animate">Gallery</a>
      <a href="contact.html" class="btn btn-animate">Contact</a>
    </div>

  </div>
</section>

<div class="spotify-player">
  <iframe
    src="https://open.spotify.com/embed/track/3be9ACTxtcL6Zm4vJRUiPG"
    height="80"
    width="100%"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
  </iframe>
</div>

</body>
</html>

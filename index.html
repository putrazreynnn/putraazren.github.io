
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home | Putra Azren</title>
  <link rel="stylesheet" href="style.css">

  <style>
  /* ==========================
     HOMEPAGE ANIMATIONS ONLY
  ========================== */

  /* Fade-in + Slide-up */
  .fade-up {
    opacity: 0;
    transform: translateY(30px);
    animation: fadeUp 1s ease forwards;
  }

  @keyframes fadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Floating avatar */
  .float-avatar {
    animation: floatAnim 3.5s ease-in-out infinite;
  }

  @keyframes floatAnim {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }

  /* Button glow */
  .btn-animate {
    animation: glowPulse 2.5s infinite;
  }

  @keyframes glowPulse {
    0% { box-shadow: 0 0 8px rgba(42,208,255,0.4); }
    50% { box-shadow: 0 0 18px rgba(42,208,255,0.9); }
    100% { box-shadow: 0 0 8px rgba(42,208,255,0.4); }
  }

  /* Particle background */
  .home-particles {
    position: relative;
    overflow: hidden;
  }

  .home-particles::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url('https://i.imgur.com/1ZQZ1bS.png');
    opacity: 0.25;
    animation: particleMove 14s linear infinite;
    z-index: 0;
  }

  @keyframes particleMove {
    from { background-position: 0 0; }
    to { background-position: 1000px 1000px; }
  }

  /* ==========================
     TYPEWRITER EFFECT
  ========================== */

  .typewriter {
    display: inline-block;
    overflow: hidden;
    white-space: nowrap;
    border-right: 3px solid #2ad0ff;
    width: 0;
    animation:
      typing 2.8s steps(24, end) forwards,
      blink 0.7s step-end infinite;
  }

  @keyframes typing {
    from { width: 0; }
    to { width: 100%; }
  }

  @keyframes blink {
    50% { border-color: transparent; }
  }

  /* Quick navigation buttons */
  .quick-nav {
    margin-top: 40px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 18px;
  }

  .quick-nav .btn {
    padding: 12px 24px;
    font-size: 1rem;
    border-radius: 8px;
    background: linear-gradient(135deg, #2ad0ff, #478bff);
    color: #06101f;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .quick-nav .btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 15px rgba(42,208,255,0.7);
  }
  </style>
</head>

<section class="section home home-particles">
